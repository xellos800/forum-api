services:
  api:
    image: xellos800/forum-api
    depends_on:
      - postgres
    ports:
      - 80:8000
    env_file:
      - ./app/.env
    environment:
      DB_HOSTNAME: postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-db:/var/lib/postgresql

volumes:
  postgres-db:
